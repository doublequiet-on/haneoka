name: Publish current Gekiso timing positions
on:
  workflow_dispatch:
    inputs:
      producer_pin:
        description: Reviewed full commit containing the timing analyser and sparse publisher
        required: true
        type: string
      server:
        required: true
        type: choice
        options: [intl, jp]
        default: intl
      identity_json:
        description: Exact current server, releaseId and sourceId; no fallback source
        required: true
        type: string
      publish:
        required: true
        type: boolean
        default: false
      rebuild_site:
        description: Build after promotion unless an approved later frontend job already covers the new pin
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: current-gekiso-timing-${{ inputs.server }}
  cancel-in-progress: false
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: resource-${{ inputs.server }}
    outputs:
      release_promoted: ${{ steps.project.outputs.release_promoted }}
    env:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.producer_pin }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Materialize and verify the existing committed converter pins
        run: |
          node scripts/external-repositories.mjs checkout
          node scripts/external-repositories.mjs verify
      - name: Install existing locked R2 and minimal canonical converter imports
        run: |
          python scripts/publish/reference_postpin.py --bootstrap "$RUNNER_TEMP/timing-dependencies"
          python -m pip install --disable-pip-version-check --require-hashes \
            --requirement "$RUNNER_TEMP/timing-dependencies/requirements.txt"
          pnpm --dir "$RUNNER_TEMP/timing-dependencies/node" install --ignore-scripts
          ln -s "$RUNNER_TEMP/timing-dependencies/node/node_modules" node_modules
      - name: Compute timing positions and optionally promote immutable API delta
        id: project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          PRODUCER_PIN: ${{ inputs.producer_pin }}
          RESOURCE_SERVER: ${{ inputs.server }}
          DIFFICULTY_CURRENT_IDENTITY_JSON: ${{ inputs.identity_json }}
          PUBLISH: ${{ inputs.publish }}
        run: python scripts/publish/chart_difficulty.py --timing --output "$RUNNER_TEMP/timing-output"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gekiso-timing-${{ inputs.server }}-${{ github.run_id }}
          path: ${{ runner.temp }}/timing-output/*.json
          if-no-files-found: ignore
          retention-days: 7
  rebuild-site:
    name: Rebuild site pages after verified timing promotion
    needs: timing
    if: ${{ inputs.rebuild_site && needs.timing.outputs.release_promoted == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch normal site build after timing current readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --repo "$GITHUB_REPOSITORY" --ref main
