name: Refresh announcements

on:
  workflow_dispatch:
    inputs:
      server:
        description: Game server
        type: choice
        required: true
        default: jp
        options: [jp, intl]
      github_environment:
        description: GitHub environment
        type: string
        required: false
      repair_published:
        description: Repair only the published unset-timestamp sentinel without requesting the game API
        type: boolean
        required: false
        default: false
      source_id:
        description: Package source whose version should be sent to the bootstrap API
        type: string
        required: false
      restore_archive:
        description: Restore saved historical announcements without requesting the game API
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      source_repository:
        type: string
        required: false
      source_ref:
        type: string
        required: false
      api_egress:
        type: boolean
        required: false
        default: false
      server:
        type: string
        required: true
      github_environment:
        type: string
        required: true
      source_id:
        type: string
        required: false
      repair_published:
        type: boolean
        required: false
        default: false
      restore_archive:
        type: boolean
        required: false
        default: false
    secrets:
      RESOURCE_PIPELINE_CONFIG:
        required: true
      cloudflare_account_id:
        required: true
      r2_access_key_id:
        required: true
      r2_secret_access_key:
        required: true
      resource_cdn_authorization:
        required: false
      jp_version_subscription:
        required: false
      resource_api_egress_subscription:
        required: false

permissions:
  contents: read

concurrency:
  group: announcements-${{ inputs.server }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.github_environment || format('resource-{0}', inputs.server) }}
    env:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
      RESOURCE_SERVER: ${{ inputs.server }}
      SOURCE_ID: ${{ inputs.source_id }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare_account_id || secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.r2_access_key_id || secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.r2_secret_access_key || secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONPATH: scripts
      RESOURCE_CDN_AUTHORIZATION: ${{ secrets.resource_cdn_authorization || secrets.RESOURCE_CDN_AUTHORIZATION }}
      JP_VERSION_SUBSCRIPTION: ${{ secrets.jp_version_subscription || secrets.JP_VERSION_SUBSCRIPTION }}
      RESOURCE_API_EGRESS_SUBSCRIPTION: ${{ secrets.RESOURCE_API_EGRESS_SUBSCRIPTION || secrets.resource_api_egress_subscription }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Validate resource source audience
        run: |
          audience=production
          if [[ "$RESOURCE_SERVER" != "jp" && "$RESOURCE_SERVER" != "intl" ]]; then
            audience=restricted
          fi
          python -m core.server_policy --server "$RESOURCE_SERVER" --audience "$audience"
      - uses: ./.github/actions/setup-resource-pipeline
      - name: Start resource API egress
        if: ${{ !inputs.restore_archive && (inputs.api_egress || startsWith(inputs.server, 'jp')) && (env.RESOURCE_API_EGRESS_SUBSCRIPTION != '' || env.JP_VERSION_SUBSCRIPTION != '') }}
        uses: ./.github/actions/setup-jp-api-egress
        with:
          subscription_url: ${{ env.RESOURCE_API_EGRESS_SUBSCRIPTION || env.JP_VERSION_SUBSCRIPTION }}
      - name: Refresh announcement snapshot
        run: |
          if [[ "${{ inputs.restore_archive }}" != "true" && "$(python -m core.config --server "$RESOURCE_SERVER" --field has-announcements)" != "true" ]]; then
            echo "No announcement endpoint is configured for $RESOURCE_SERVER"
            exit 0
          fi
          args=(--server "$RESOURCE_SERVER" --concurrency 16)
          if [[ -n "$SOURCE_ID" ]]; then
            args+=(--source "$SOURCE_ID")
          fi
          if [[ "${{ inputs.restore_archive }}" == "true" ]]; then
            args+=(--restore-archive)
          elif [[ "${{ inputs.repair_published }}" == "true" ]]; then
            args+=(--repair-published)
          fi
          python scripts/publish/announcements.py "${args[@]}"
