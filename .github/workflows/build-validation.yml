name: Build validation

on:
  schedule:
    - cron: "20 11 * * *"
  workflow_dispatch:
    inputs:
      server:
        description: Build source ("all" includes only daily sources)
        required: true
        default: all
        type: choice
        options:
          - all
          - intl-test
          - jp-test-01
          - jp-test-02
          - jp-test-03
          - jp-cbt
          - intl-cbt
      github_environment:
        description: GitHub Actions environment for the run
        required: false
        default: ""
        type: string
      package_r2_key:
        description: Private R2 CAS key of one APK, APKS, or XAPK file
        required: false
        type: string
      source_id:
        description: Existing immutable R2 source id to resume without ingestion
        required: false
        type: string
      resume_stage_run_id:
        description: Reuse verified Master and Unity stages from this run; requires source_id
        required: false
        type: string
      ktx2:
        description: Package original runtime texture blocks
        required: false
        default: true
        type: boolean
      basis_reencode:
        description: Lossy runtime-only Basis opt-in; preserve canonical PNGs
        required: false
        default: false
        type: boolean
      force:
        description: Rebuild even when the source identity is unchanged
        required: false
        default: false
        type: boolean
      no_reuse:
        description: Disable cross-source and cross-build artifact reuse
        required: false
        default: false
        type: boolean

concurrency:
  group: build-validation-${{ github.event_name == 'schedule' && 'daily' || inputs.server }}
  cancel-in-progress: false

jobs:
  select:
    name: Select build sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      servers: ${{ steps.servers.outputs.servers }}
    steps:
      - uses: actions/checkout@v7
      - name: Select scheduled or manually requested sources
        id: servers
        env:
          PYTHONPATH: scripts
          SERVER_SELECTION: ${{ github.event_name == 'schedule' && 'all' || inputs.server }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          extra=()
          if [[ "$SCHEDULED" == "true" || "$SERVER_SELECTION" == "all" ]]; then extra+=(--scheduled); fi
          servers="$(python -m core.server_policy --server "$SERVER_SELECTION" --audience restricted "${extra[@]}")"
          echo "servers=$servers" >> "$GITHUB_OUTPUT"

  pipeline:
    name: Build and publish ${{ matrix.server }} resources
    needs: select
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        server: ${{ fromJSON(needs.select.outputs.servers) }}
    uses: ./.github/workflows/resource-pipeline-run.yml
    with:
      audience: restricted
      api_egress: ${{ startsWith(matrix.server, 'jp-test-') }}
      github_environment: ${{ inputs.github_environment || format('resource-{0}', matrix.server) }}
      server: ${{ matrix.server }}
      package_r2_key: ${{ inputs.package_r2_key }}
      package_source_server: ${{ startsWith(matrix.server, 'jp-test-') && 'jp' || '' }}
      source_id: ${{ inputs.source_id }}
      resume_stage_run_id: ${{ inputs.resume_stage_run_id }}
      ktx2: ${{ github.event_name == 'schedule' || inputs.ktx2 || false }}
      basis_reencode: ${{ inputs.basis_reencode || false }}
      force: ${{ inputs.force || false }}
      no_reuse: ${{ inputs.no_reuse || false }}
    secrets:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      resource_cdn_authorization: ${{ secrets.RESOURCE_CDN_AUTHORIZATION }}
      secret_writer_gh_token: ${{ secrets.SECRET_WRITER_GH_TOKEN }}
      jp_version_subscription: ${{ secrets.JP_VERSION_SUBSCRIPTION }}
      resource_api_egress_subscription: ${{ secrets.RESOURCE_API_EGRESS_SUBSCRIPTION }}
